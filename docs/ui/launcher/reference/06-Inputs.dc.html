<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launcher inputs menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ll.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5F2EC}a:hover{color:#BAB7B0}
</style>
</helmet>
<div class="ll" style="background: #0F1215">

<div class="ll-clockarea">
<p class="ll-greet">Good evening, Ana</p>
<div class="ll-clockrow"><p class="ll-clock">21:40</p><p class="ll-date ll-date--beside"><span>Monday</span><small>26 October</small></p></div>
</div>
<p class="ll-appname">YouTube</p>
<div class="ll-dock">
<sc-for list="{{dock}}" as="a" hint-placeholder-count="5">
<div class="ll-banner" style="--tint: {{a.tint}}; --a1: {{a.a1}}; --a2: {{a.a2}}">
<span class="ll-banner__a"></span><span class="ll-banner__b"></span>
<span class="ll-banner__name">{{a.name}}</span>
</div>
</sc-for>
</div>
<div class="ll-scrim"></div>

<div class="ll-island ll-island--open" role="dialog" aria-label="Inputs">
<div class="ll-isl-tabs">
<span class="ll-isl-btn is-active"><svg class="ll-ico ll-ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1"/><path d="M3 12h10"/><path d="M10 9l3 3-3 3"/></svg>Inputs</span>
<span class="ll-isl-btn"><svg class="ll-ico ll-ico--sm" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(0 -1.3)"><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></g></svg>Wi-Fi</span>
<span class="ll-isl-btn"><svg class="ll-ico ll-ico--sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Apps</span>
<span class="ll-isl-btn"><svg class="ll-ico ll-ico--sm" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(12 12) scale(0.96) translate(-12 -12)"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" vector-effect="non-scaling-stroke"/><circle cx="12" cy="12" r="3" vector-effect="non-scaling-stroke"/></g></svg>Settings</span>
</div>
<div class="ll-isl-body">
<div class="ll-sources">
<button class="ll-source is-focus" type="button">
<svg class="ll-ico ll-ico--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v7l-3.5 3.5h-11L3 14z"/><path d="M7.5 11h9"/></svg>
<span class="ll-source__name">HDMI 1</span>
<span class="ll-source__meta"><span class="ll-island__dot" style="background: #1C7A48"></span>PlayStation 5</span>
</button>
<button class="ll-source" type="button">
<svg class="ll-ico ll-ico--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v7l-3.5 3.5h-11L3 14z"/><path d="M7.5 11h9"/></svg>
<span class="ll-source__name">HDMI 2</span>
<span class="ll-source__meta"><span class="ll-island__dot is-off"></span>No signal</span>
</button>
<button class="ll-source" type="button">
<svg class="ll-ico ll-ico--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v7l-3.5 3.5h-11L3 14z"/><path d="M7.5 11h9"/></svg>
<span class="ll-source__name">HDMI 3</span>
<span class="ll-source__meta"><span class="ll-island__dot"></span>Soundbar · ARC</span>
</button>
<button class="ll-source" type="button">
<svg class="ll-ico ll-ico--lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 3.5l4 4.5 4-4.5"/></svg>
<span class="ll-source__name">TV aerial</span>
<span class="ll-source__meta"><span class="ll-island__dot is-off"></span>Live channels</span>
</button>
</div>
<div class="ll-isl-hint"><span class="ll-hint"><span class="ll-key">OK</span>Switch to this input</span><span class="ll-hint"><span class="ll-key">Back</span>Close</span></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      dock: [
        { name: 'YouTube', tint: '#7D2A27', a1: 'rgba(255,214,200,0.16)', a2: 'rgba(30,6,6,0.30)' },
        { name: 'Netflix', tint: '#26262D', a1: 'rgba(200,60,60,0.30)', a2: 'rgba(0,0,0,0.35)' },
        { name: 'Prime Video', tint: '#1E3954', a1: 'rgba(140,200,255,0.18)', a2: 'rgba(5,15,30,0.35)' },
        { name: 'Spotify', tint: '#1D4632', a1: 'rgba(120,230,160,0.18)', a2: 'rgba(0,20,10,0.35)' },
        { name: 'Plex', tint: '#4A391A', a1: 'rgba(240,190,80,0.22)', a2: 'rgba(20,12,0,0.35)' }
      ]
    };
  }
}
</script>
</body>
</html>
