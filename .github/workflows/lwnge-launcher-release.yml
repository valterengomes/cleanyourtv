# LWNGE: build the LWNGE-branded launcher (CleanYourTV + LWNGE branding, branch lwnge-brand) at a pinned commit and publish the APK as a release,
# so LWNGE users do not need Android Studio. Runs only when a "lwnge-launcher-*" tag is pushed, on Valter's own WSL
# runner (no GitHub-hosted minutes).
# Signed with LWNGE's own stable key (secret LWNGE_LAUNCHER_KEYSTORE), so later releases install as updates.
name: LWNGE launcher release

on:
  push:
    tags: ["lwnge-launcher-*"]

permissions:
  contents: write # create the release
  id-token: write # build provenance attestation
  attestations: write

env:
  LAUNCHER_COMMIT: 8f418b3434ced372605d93666e6fcf50f47bcf6a
  # SHA-256 of LWNGE's signing certificate. A release signed with anything else is refused.
  SIGNER_SHA256: 9e2bf89484e31372691f4855b80a4452977aa25a3381b1541a934532b6ec485e

jobs:
  build:
    runs-on: [self-hosted, cleanyourtv-wsl]
    timeout-minutes: 30
    steps:
      - name: Clean the work folder
        run: rm -rf src lwnge-launcher.apk lwnge-launcher.apk.sha256 signer.txt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LAUNCHER_COMMIT }}
          path: src
          persist-credentials: false
      - name: Check the source is the pinned commit
        run: test "$(git -C src rev-parse HEAD)" = "$LAUNCHER_COMMIT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.LWNGE_LAUNCHER_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "secret LWNGE_LAUNCHER_KEYSTORE is missing"; exit 1; }
          # The secret may carry Windows line endings or spaces, which base64 -d rejects.
          printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/lwnge.keystore"
          keytool -list -keystore "$RUNNER_TEMP/lwnge.keystore" -storepass android | grep -q androiddebugkey
      - name: Build
        working-directory: src/launcher
        # android.injected.signing.* overrides the build's signing config (the same properties Android Studio
        # uses), so the APK is signed with LWNGE's key without changing the launcher's source.
        run: |
          test -n "$ANDROID_HOME" || { echo "ANDROID_HOME is not set on this runner"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --console=plain -q \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/lwnge.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/lwnge-launcher.apk"
      - name: Check the signer
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs lwnge-launcher.apk | tee signer.txt
          grep -qi "certificate SHA-256 digest: $SIGNER_SHA256" signer.txt
      - name: Checksum
        run: sha256sum lwnge-launcher.apk | tee lwnge-launcher.apk.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: lwnge-launcher.apk
      - name: Release
        # The GitHub API directly: the runner has no gh CLI.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          repo, tag, token = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_REF_NAME"], os.environ["GH_TOKEN"]
          head = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          notes = ("LWNGE launcher: CleanYourTV (MIT) with LWNGE branding, built from commit "
                   f"{os.environ['LAUNCHER_COMMIT']}. Built on LWNGE's own runner; LWNGE checks the SHA-256 before installing.")
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases", method="POST", headers=head,
                                       data=json.dumps({"tag_name": tag, "name": tag, "body": notes}).encode())
          release = json.load(urllib.request.urlopen(req))
          for name in ("lwnge-launcher.apk", "lwnge-launcher.apk.sha256"):
              up = urllib.request.Request(
                  f"https://uploads.github.com/repos/{repo}/releases/{release['id']}/assets?name={name}",
                  method="POST", data=pathlib.Path(name).read_bytes(),
                  headers={**head, "Content-Type": "application/octet-stream"})
              urllib.request.urlopen(up).read()
              print("uploaded", name)
          PY
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lwnge.keystore"
